<!doctype html><html><head><meta charset="utf-8"><title>Mail-Merger</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f8;color:#152238;font:15px/1.5 'Segoe UI',sans-serif}.card{width:440px;max-width:calc(100vw - 40px);background:#fff;border:1px solid #dce3ed;border-radius:16px;padding:34px;box-shadow:0 16px 50px #17325014}.brand{font-size:16px;font-weight:650;color:#2048df}h1{font-size:25px;line-height:1.25;margin:22px 0 8px}p{color:#526176;overflow-wrap:anywhere;margin:0 0 24px}label{display:block;margin:18px 0 7px}input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #bac6d5;font:15px 'Segoe UI',sans-serif}button{margin-top:16px;background:#2048df;color:#fff;font-weight:600;border-color:#2048df;cursor:pointer}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #90b6ff;outline-offset:2px}#message{margin-top:18px;margin-bottom:0;min-height:22px}#message.error{color:#b42318}[hidden]{display:none!important}
</style></head><body><main class="card"><div class="brand">Mail-Merger</div><h1>Unlock your history</h1><p>OWNER_EMAIL</p>
<form id="request"><label for="passphrase">Private-key passphrase</label><input id="passphrase" type="password" autocomplete="current-password" required><button>Send unlock code</button></form>
<form id="verify" hidden><label for="code">Email code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><button>Unlock history</button><button id="again" type="button" style="background:#fff;color:#2048df">Request another code</button></form>
<details style="margin-top:24px"><summary>Recovery &amp; code-sending account</summary><button id="restore" type="button">Restore encrypted recovery key</button><form id="transport"><label for="transport-pass">Private-key passphrase</label><input id="transport-pass" type="password" autocomplete="off" required><label for="transport-email">Code-sending Gmail account</label><input id="transport-email" type="email" required><label for="transport-password">Google app password</label><input id="transport-password" type="password" autocomplete="off" required><button>Update code-sending account</button></form></details>
<p id="message" role="status" aria-live="polite"></p></main><script>
const request=document.getElementById('request'),verify=document.getElementById('verify'),message=document.getElementById('message');
async function submit(form,fn){const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const result=await fn();message.textContent=result.message;message.className=result.ok?'':'error';if(result.ok&&result.url)window.location.replace(result.url);return result.ok;}catch{message.textContent='Could not finish. Please try again.';message.className='error';return false;}finally{buttons.forEach(b=>b.disabled=false);}}
request.onsubmit=async event=>{event.preventDefault();const passphrase=document.getElementById('passphrase');const value=passphrase.value;passphrase.value='';if(await submit(request,()=>window.pywebview.api.request_unlock_code(value))){request.hidden=true;verify.hidden=false;document.getElementById('code').focus();}};
verify.onsubmit=async event=>{event.preventDefault();const code=document.getElementById('code'),value=code.value;code.value='';await submit(verify,()=>window.pywebview.api.unlock_history(value));};
document.getElementById('again').onclick=()=>{verify.hidden=true;request.hidden=false;document.getElementById('passphrase').focus();};
document.getElementById('restore').onclick=async()=>{const result=await window.pywebview.api.restore_recovery_key();message.textContent=result.message;};
document.getElementById('transport').onsubmit=async event=>{event.preventDefault();const form=event.target,pass=document.getElementById('transport-pass'),password=document.getElementById('transport-password');const values=[pass.value,document.getElementById('transport-email').value,password.value];pass.value=password.value='';await submit(form,()=>window.pywebview.api.change_code_account(...values));};
</script></body></html>
