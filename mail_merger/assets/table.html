<section class="recipient-grid">
  <div class="grid-tools"><input class="grid-search" placeholder="Search recipients…" aria-label="Search recipients"><span class="grid-count"></span></div>
  <div class="grid-actions"><button type="button" class="select-all">Select valid</button><button type="button" class="clear-all">Clear selection</button></div>
  <div class="grid-scroll"><table><thead></thead><tbody></tbody></table></div>
  <div class="grid-pager"><button type="button" class="previous">← Previous</button><span class="page-label"></span><button type="button" class="next">Next →</button></div>
</section>
