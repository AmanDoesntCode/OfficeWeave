<!doctype html><html><head><meta charset="utf-8"><title>Mail-Merger</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f8;color:#152238;font:15px/1.5 'Segoe UI',sans-serif}.card{width:440px;max-width:calc(100vw - 40px);background:white;border:1px solid #dce3ed;border-radius:16px;padding:34px;box-shadow:0 16px 50px #17325014}.brand{font-size:16px;font-weight:650;color:#2048df}h1{font-size:25px;line-height:1.25;margin:22px 0 8px}p{color:#526176;overflow-wrap:anywhere;margin:0 0 22px}label{display:block;margin:18px 0 7px}input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #bac6d5;font:15px 'Segoe UI',sans-serif}button{margin-top:16px;background:#2048df;color:white;font-weight:600;border-color:#2048df;cursor:pointer}button.secondary{background:white;color:#2048df}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #90b6ff;outline-offset:2px}#message{margin-top:18px;margin-bottom:0;min-height:22px}#message.error{color:#b42318}[hidden]{display:none!important}a{color:#2048df}
</style></head><body><main class="card"><div class="brand">Mail-Merger</div>
<section id="signin"><h1>Sign in with Google</h1><p>Open your mail-merge workspace.</p><button id="continue" class="secondary" data-email="SAVED_ACCOUNT">Continue as SAVED_ACCOUNT</button><form id="login"><label for="email">Gmail address</label><input id="email" type="email" autocomplete="username" required><label for="password">Google app password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><p style="margin-top:16px;margin-bottom:0"><a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener noreferrer">Get a Google app password</a></p></section>
<section id="unlock" hidden><h1 id="verify-heading">Verify your email</h1><p id="owner"></p><form id="verify"><label for="code">Email code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><button>Verify and open workspace</button><button id="again" class="secondary" type="button">Resend code</button></form><section id="upgrade" hidden><p>Your previous files use an older history password. Enter it once to keep those records, or open a fresh workspace. Future sign-ins use your Gmail app password and OTP.</p><form id="upgrade-form"><label for="previous">Previous history password</label><input id="previous" type="password" autocomplete="off" required><button>Upgrade previous history</button></form><button id="fresh" class="secondary">Open a fresh workspace</button></section><button id="other" class="secondary">Use another Gmail account</button></section>
<p id="message" role="status" aria-live="polite"></p></main><script>
const signin=document.getElementById('signin'),unlock=document.getElementById('unlock'),message=document.getElementById('message');
const verify=document.getElementById('verify'),upgrade=document.getElementById('upgrade'),resume=document.getElementById('continue');
resume.hidden=!resume.dataset.email;
async function submit(container,fn){const buttons=[...container.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const result=await fn();message.textContent=result.message||'';message.className=result.ok?'':'error';if(result.ok&&(result.stage==='otp'||result.stage==='upgrade')){signin.hidden=true;unlock.hidden=false;document.getElementById('owner').textContent=result.owner;verify.hidden=result.stage==='upgrade';upgrade.hidden=result.stage!=='upgrade';document.getElementById('verify-heading').textContent=result.stage==='upgrade'?'Upgrade previous history':'Verify your email';document.getElementById(result.stage==='upgrade'?'previous':'code').focus();}if(result.ok&&result.url)location.replace(result.url);return result.ok;}catch{message.textContent='Could not finish. Please try again.';message.className='error';return false;}finally{buttons.forEach(b=>b.disabled=false);}}
document.getElementById('login').onsubmit=async event=>{event.preventDefault();const password=document.getElementById('password'),value=password.value;password.value='';await submit(signin,()=>window.pywebview.api.sign_in_gmail(document.getElementById('email').value,value));};
resume.onclick=()=>submit(signin,()=>window.pywebview.api.continue_saved_account());
verify.onsubmit=async event=>{event.preventDefault();const code=document.getElementById('code'),value=code.value;code.value='';await submit(unlock,()=>window.pywebview.api.verify_sign_in_code(value));};
document.getElementById('again').onclick=()=>submit(unlock,()=>window.pywebview.api.resend_sign_in_code());
document.getElementById('other').onclick=async()=>{if(await submit(unlock,()=>window.pywebview.api.back_to_sign_in())){unlock.hidden=true;signin.hidden=false;resume.hidden=true;document.getElementById('code').value='';document.getElementById('previous').value='';document.getElementById('email').focus();}};
document.getElementById('upgrade-form').onsubmit=async event=>{event.preventDefault();const input=document.getElementById('previous'),value=input.value;input.value='';await submit(unlock,()=>window.pywebview.api.upgrade_previous_history(value));};
document.getElementById('fresh').onclick=()=>submit(unlock,()=>window.pywebview.api.start_new_workspace());
</script></body></html>
